############################################################################################
############################################################################################

####################################  NEW ANIMATIONS   #####################################



animations {
    enabled = true

    # A very smooth, clean easing curve
    bezier = easeOutExpo, 0.16, 1, 0.3, 1

    # Windows: Use 'popin' or 'fade' instead of 'slide'. 
    # This prevents the "double-sliding" glitch.
    animation = windows, 1, 3, easeOutExpo, popin 80%
    animation = windowsIn, 1, 3, easeOutExpo, popin 80%
    animation = windowsOut, 1, 3, easeOutExpo, popin 80%
    
    # Workspaces: This controls the SPEED of the scrolling strip.
    # Set this to a slightly higher value (4-5) for a "heavy", high-end feel.
    animation = workspaces, 1, 4, easeOutExpo, slide
}


###########################################################################################

# see https://wiki.hyprland.org/configuring/dwindle-layout/ for more
dwindle {
    # pseudotile has been removed in v0.55 — it wasn't doing anything
    preserve_split = true # you probably want this
}

# see https://wiki.hyprland.org/configuring/master-layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/configuring/variables/#misc
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    # vfr moved to debug: section in v0.55
    always_follow_on_dnd = true
    layers_hog_keyboard_focus = true
    animate_manual_resizes = false    # High CPU/GPU cost when dragging borders
    enable_swallow = true             # Hides terminal when opening GUI apps
    focus_on_activate = true
}

debug {
    vfr = true                        # Variable Frame Rate: moved here from misc in v0.55
}



#############
### input ###
#############

# https://wiki.hyprland.org/configuring/variables/#input
input {
    kb_layout = gb
    kb_variant =
    kb_model =
    kb_options = ctrl:nocaps
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

gesture = 3, horizontal, workspace



# example per-device config
# see https://wiki.hyprland.org/configuring/keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### keybindings ###
###################

# see https://wiki.hyprland.org/configuring/keywords/
$mainmod = super # sets "windows" key as main modifier

# example binds, see https://wiki.hyprland.org/configuring/binds/ for more
bind = $mainmod, return, exec, $terminal
bind = $mainmod, q, killactive,
bind = $mainmod, f, fullscreen,
# bind = $mainmod, m, exit,
bind = $mainmod, h, exec, nvim ~/.config/hypr/hyprland.conf
bind = $mainmod, e, exec, $filemanager
bind = $mainmod, t, togglefloating,
bind = $mainmod, d, exec, $menu
# bind = $mainmod, p, pseudo, # dwindle — pseudotiling removed in v0.55
# bind = $mainmod, j, togglesplit, # dwindle — togglesplit removed in v0.55
bind = $mainmod, c, exec, hyprpicker 
bind = $mainmod, a, exec,chromium https://chatgpt.com/
bind = $mainmod, b, exec, brave
bind = $mainmod, w, exec, chromium
bind = supershift, w, exec, ~/dotfiles/.config/hypr/script/toggle_waybar.sh
bind = $mainmod, y, exec,chromium https://www.youtube.com/ 
bind = $mainmod, space, exec, waypaper
# bind = $mainmod, space, exec, ~/dotfiles/.config/hypr/script/Full_script.sh
bind = $mainmod, s, exec, hyprshot -m region -o /home/yogipatel/Pictures/screenshot/
bind = supershift, s, exec, hyprshot -m window -o /home/yogipatel/Pictures/screenshot/
bind = supershift,l,exec, hyprlock
bind = supershift, Q, exit,
bind = super, v, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = super_shift, up, exec, brightnessctl -d platform::kbd_backlight set +1
bind = super_shift, down, exec, brightnessctl -d platform::kbd_backlight set 1-
bind = $mainmod, shift w, exec, /home/yogipatel/dotfiles/.config/zsh_srcipts/restart-waybar.sh
bind = $mainmod, g, exec,chromium https://gemini.google.com/app

# Move focus with mainMod + arrow keys
bind = $mainmod, h, movefocus, l
bind = $mainmod, l, movefocus, r
bind = $mainmod, k, movefocus, u
bind = $mainmod, j, movefocus, d
# Switch workspaces with mainMod + [0-9]
bind = $mainmod, 1, workspace, 1
bind = $mainmod, 2, workspace, 2
bind = $mainmod, 3, workspace, 3
bind = $mainmod, 4, workspace, 4
bind = $mainmod, 5, workspace, 5
bind = $mainmod, 6, workspace, 6
bind = $mainmod, 7, workspace, 7
bind = $mainmod, 8, workspace, 8
bind = $mainmod, 9, workspace, 9
bind = $mainmod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainmod SHIFT, 1, movetoworkspace, 1
bind = $mainmod SHIFT, 2, movetoworkspace, 2
bind = $mainmod SHIFT, 3, movetoworkspace, 3
bind = $mainmod SHIFT, 4, movetoworkspace, 4
bind = $mainmod SHIFT, 5, movetoworkspace, 5
bind = $mainmod SHIFT, 6, movetoworkspace, 6
bind = $mainmod SHIFT, 7, movetoworkspace, 7
bind = $mainmod SHIFT, 8, movetoworkspace, 8
bind = $mainmod SHIFT, 9, movetoworkspace, 9
bind = $mainmod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainmod, grave, togglespecialworkspace, magic
bind = $mainmod SHIFT, grave, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainmod, mouse_down, workspace, e+1
bind = $mainmod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainmod, mouse:272, movewindow
bindm = $mainmod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , Next, exec, playerctl next
bindl = , Home, exec, playerctl play-pause
# bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , Prior, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
# Suppress maximize events for all windows
# Ignore maximize requests from apps
# windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
# windowrule = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0


# windowrule=float,class:.*
# debug {
#  overlay = true
# }

##############################
### TYPST PREVIEW RULES ###
##############################
# Prevent typst-preview and Zathura from stealing focus
windowrule = no_initial_focus on, match:class ^(typst-preview)$
windowrule = suppress_event activate activatefocus, match:class ^(typst-preview)$

windowrule = no_initial_focus on, match:class ^(org.pwmt.zathura)$
windowrule = suppress_event activate activatefocus, match:class ^(org.pwmt.zathura)$


##############################
### WAYPAPER WINDOW RULES  ###
##############################
windowrule = float on, match:class ^(waypaper)$
windowrule = center on, match:class ^(waypaper)$
windowrule = size 850 650, match:class ^(waypaper)$

layerrule = no_anim on, match:namespace ^(wofi)$
